<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Joke Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 600px;
            width: 100%;
            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 32px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .joke-box {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            border-radius: 10px;
            margin: 30px 0;
            min-height: 120px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 18px;
            line-height: 1.6;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
        }

        .joke-text {
            margin-bottom: 15px;
        }

        .joke-setup {
            font-weight: bold;
            margin-bottom: 10px;
            font-style: italic;
        }

        .joke-punchline {
            font-weight: bold;
            margin-top: 15px;
            font-size: 20px;
            color: #ffd700;
        }

        .button-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 30px;
            font-size: 16px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-get-joke {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            flex: 1;
            min-width: 150px;
        }

        .btn-get-joke:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .btn-get-joke:active {
            transform: translateY(0);
        }

        .btn-copy {
            background: #4CAF50;
            color: white;
            min-width: 120px;
        }

        .btn-copy:hover {
            background: #45a049;
            transform: translateY(-2px);
        }

        .btn-copy:active {
            transform: translateY(0);
        }

        .loading {
            display: none;
            color: #667eea;
            font-style: italic;
            margin: 20px 0;
        }

        .loading.active {
            display: block;
        }

        .error {
            display: none;
            background: #ffebee;
            color: #c62828;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            border-left: 4px solid #c62828;
        }

        .error.active {
            display: block;
        }

        .copy-notification {
            display: none;
            position: fixed;
            top: 20px;
            right: 20px;
            background: #4CAF50;
            color: white;
            padding: 15px 25px;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            animation: slideIn 0.3s ease;
            z-index: 1000;
        }

        .copy-notification.active {
            display: block;
        }

        @keyframes slideIn {
            from {
                transform: translateX(400px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .joke-type {
            color: #999;
            font-size: 12px;
            margin-top: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        @media (max-width: 600px) {
            .container {
                padding: 25px;
            }

            h1 {
                font-size: 24px;
            }

            .joke-box {
                padding: 20px;
                min-height: 100px;
                font-size: 16px;
            }

            button {
                padding: 10px 20px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>😂 Joke Generator</h1>
        <p class="subtitle">Get a random laugh every time!</p>

        <div class="joke-box" id="jokeBox">
            <p>Click the button below to get a joke!</p>
        </div>

        <div class="loading" id="loading">
            Loading a fresh joke for you... ⏳
        </div>

        <div class="error" id="error"></div>

        <div class="button-group">
            <button class="btn-get-joke" onclick="getJoke()">Get New Joke</button>
            <button class="btn-copy" onclick="copyJoke()">📋 Copy</button>
        </div>

        <div class="joke-type" id="jokeType"></div>
    </div>

    <div class="copy-notification" id="notification">
        ✓ Joke copied to clipboard!
    </div>

    <script>
        let currentJoke = '';

        async function getJoke() {
            const jokeBox = document.getElementById('jokeBox');
            const loading = document.getElementById('loading');
            const errorDiv = document.getElementById('error');
            const jokeType = document.getElementById('jokeType');
            const btn = event.target;

            // Reset states
            loading.classList.add('active');
            errorDiv.classList.remove('active');
            btn.disabled = true;

            try {
                // Using JokeAPI - a free API for getting jokes
                const response = await fetch('https://v2.jokeapi.dev/joke/Any?format=json&safe-mode');
                
                if (!response.ok) {
                    throw new Error('Failed to fetch joke');
                }

                const data = await response.json();

                // Display the joke based on its type (single or two-part)
                if (data.type === 'single') {
                    currentJoke = data.joke;
                    jokeBox.innerHTML = `<p class="joke-text">${data.joke}</p>`;
                    jokeType.textContent = '📌 Single Joke';
                } else {
                    currentJoke = `${data.setup}\n\n${data.delivery}`;
                    jokeBox.innerHTML = `
                        <p class="joke-setup">${data.setup}</p>
                        <p class="joke-punchline">${data.delivery}</p>
                    `;
                    jokeType.textContent = '📌 Two-Part Joke';
                }

                loading.classList.remove('active');
            } catch (error) {
                console.error('Error:', error);
                errorDiv.textContent = '❌ Oops! Could not fetch a joke. Please try again!';
                errorDiv.classList.add('active');
                jokeBox.innerHTML = '<p>Failed to load joke. Please check your connection and try again.</p>';
                loading.classList.remove('active');
            } finally {
                btn.disabled = false;
            }
        }

        function copyJoke() {
            if (!currentJoke) {
                alert('Please get a joke first!');
                return;
            }

            if (navigator.clipboard) {
                navigator.clipboard.writeText(currentJoke).then(() => {
                    showNotification();
                }).catch(() => {
                    fallbackCopy();
                });
            } else {
                fallbackCopy();
            }
        }

        function fallbackCopy() {
            const textarea = document.createElement('textarea');
            textarea.value = currentJoke;
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand('copy');
            document.body.removeChild(textarea);
            showNotification();
        }

        function showNotification() {
            const notification = document.getElementById('notification');
            notification.classList.add('active');
            setTimeout(() => {
                notification.classList.remove('active');
            }, 2000);
        }

        // Get a joke when the page loads
        window.addEventListener('load', () => {
            getJoke();
        });

        // Allow Enter key to get a new joke
        document.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                getJoke();
            }
        });
    </script>
</body>
</html>
